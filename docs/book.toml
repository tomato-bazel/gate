[book]
title = "tomato-bazel registry conformance"
authors = ["Matt Marshall"]
src = "src"
language = "en"

# `src/` is GENERATED — `bazel build //gates:report` writes it, and the CI job
# copies the tree artifact here before rendering. Nothing in it is hand-edited,
# which is why it is gitignored: the report is a function of the registry, and a
# committed copy would be stale the moment a module is published.
[output.html]
# The brand theme, staged from @brand//mdbook:theme by //docs:theme. mdBook
# picks up theme/head.hbs and theme/favicon.svg from the book root
# automatically; the stylesheet has to be named explicitly.
additional-css = ["theme/css/custom.css"]
git-repository-url = "https://github.com/tomato-bazel/gate"
edit-url-template = ""
no-section-label = true

[output.html.fold]
enable = true
level = 1
